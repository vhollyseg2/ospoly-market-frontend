<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A16" />
    <meta name="description" content="Discover products from reviewed sellers near you. Shop phones, fashion, electronics, home essentials and more with local and nationwide delivery across Nigeria." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.flexiacart.top/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:site_name" content="FlexiaCart" />
    <meta property="og:title" content="FlexiaCart — Shop More. Sell Smarter." />
    <meta property="og:description" content="A flexible Nigerian marketplace for trusted products, smart selling, local discovery and nationwide delivery." />
    <meta property="og:url" content="https://www.flexiacart.top/" />
    <meta property="og:image" content="https://www.flexiacart.top/hero-marketplace.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>FlexiaCart — Shop More. Sell Smarter.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FlexiaCart",
        "url": "https://www.flexiacart.top/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.flexiacart.top/products?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
